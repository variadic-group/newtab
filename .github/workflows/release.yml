# Each push to main releases the manifest's version if it has no release yet: the extension
# folder zipped, under a tag v<version>. So raising "version" in extension/manifest.json is
# what cuts a release, and the README's install steps always have a file to point at.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the source
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Release this version if it has none yet
        run: |
          version="$(jq -r .version extension/manifest.json)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released."
            exit 0
          fi
          (cd extension && zip -qr "../newtab-$version.zip" . -x '.*')
          gh release create "v$version" "newtab-$version.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "New Tab $version" \
            --notes "Download the zip, unzip it, then load the folder from chrome://extensions with Developer mode on. The README has the steps."
