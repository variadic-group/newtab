# Pushing a tag like v3.0.0 zips the extension folder and publishes it as a release, so the
# install steps in the README always have a file to point at.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the tagged source
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .
      - name: Check the tag is the manifest's version
        run: test "v$(jq -r .version extension/manifest.json)" = "$GITHUB_REF_NAME"
      - name: Zip the extension
        run: cd extension && zip -qr "../newtab-${GITHUB_REF_NAME#v}.zip" . -x '.*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "newtab-${GITHUB_REF_NAME#v}.zip"
          --title "New Tab ${GITHUB_REF_NAME#v}"
          --notes "Download the zip, unzip it, then load the folder from chrome://extensions with Developer mode on. The README has the steps."
